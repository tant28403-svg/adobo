[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adobo"
version = "0.1.0"
description = "Simple UDP Stress Tester"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    # adobo.config and adobo.defenses both import yaml at module level.
    "pyyaml>=6.0",
    # adobo.monitor imports psutil to sample the local target process.
    "psutil>=5.9",
    # adobo.engine imports httpx for target health probing.
    "httpx>=0.28",
    # adobo.transports.http2_transport imports h2 at module level, and
    # adobo.transports/__init__.py imports that module unconditionally, which
    # adobo.engine imports in turn. So this is not optional in practice: without
    # it `import adobo` fails outright rather than degrading. It was undeclared,
    # which meant the tool only worked on machines that happened to have it
    # installed already.
    "h2>=4.1",
    # Banner rendering
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
raw = ["scapy>=2.6"]
# HTTP/3 (--transport h3). Optional in a way h2 is not: every aioquic import in
# adobo/transports/http3_transport.py is inside a function or a lazy builder, so
# the tool starts and every other transport works without it. It is declared here
# rather than left undeclared so a machine that wants h3 has something to install.
http3 = ["aioquic>=1.0"]
# The lab target (adobo.target) is a server, not part of the CLI. Kept optional
# so an operator who only generates load does not pull in a web framework.
lab = ["fastapi>=0.110", "uvicorn>=0.27"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[project.scripts]
ADOBO = "adobo.cli:main"

[tool.setuptools.packages.find]
include = ["adobo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["adobo"]
branch = true