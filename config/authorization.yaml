# Written authorization record.
#
# The engine REFUSES to open a socket unless this file is present, unexpired,
# and its scope covers the target. This models real engagement practice: you
# document who approved the test, what was in scope, and when it lapses.
#
# This template ships EXPIRED on purpose, so the tool fails closed. To run a
# real scenario you must consciously edit it:
#
#   operator:   your name
#   issuer:     your lab instructor / team lead
#   reference:  ticket or approval id
#   scope:      the CIDR(s) you are authorized to test
#   expires_on: a date in the future
#
# For the built-in loopback lab, the defaults below are sufficient once you
# have set expires_on to a future date.

operator: "unassigned"
issuer: "unassigned"
reference: "NONE"
scope:
  - "127.0.0.0/8"
issued_on: 2026-01-01
expires_on: 2026-01-02
notes: "Template - EXPIRED by default so the engine fails closed. Edit before use."
