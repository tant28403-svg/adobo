# Network Stress Testing & DDoS Resilience Simulator - lab policy
#
# This file is the single source of truth for what the engine is PERMITTED to
# do. Every value under `limits` is a hard ceiling: the engine clamps each run
# down to it, and no command-line flag can raise it.

lab_id: "adobo"

# ---------------------------------------------------------------------------
# Allowlist - the only networks this tool may ever send traffic to.
# Loopback only by default, so an unconfigured checkout is inert.
#
# To add a second machine in your lab (e.g. a Linux VM running the hardened
# target), add its subnet here deliberately, one line at a time.
# ---------------------------------------------------------------------------
allowed_cidrs:
  - "127.0.0.0/8"
  - "::1/128"

# ---------------------------------------------------------------------------
# Hard ceilings
# ---------------------------------------------------------------------------
limits:
  max_pps: 20000
  max_duration_seconds: 60
  max_payload_bytes: 1400
  max_workers: 8

# Default target: the local vulnerable app started by `ADOBO target`.
target:
  host: "127.0.0.1"
  port: 8000

# ---------------------------------------------------------------------------
# Measurement cadence
# ---------------------------------------------------------------------------
measurement:
  sample_interval_ms: 1000
  probe_interval_ms: 250
  probe_path: "/healthz"
  probe_timeout_ms: 1500

# ---------------------------------------------------------------------------
# Output locations (relative to the project root)
# ---------------------------------------------------------------------------
paths:
  log_dir: "logs"
  report_dir: "reports"
  results_dir: "results"
  audit_log: "logs/audit.jsonl"
